# Argo CD Helm values – westerweel.work homelab
# Chart: argo/argo-cd
# TLS terminated at Gateway (Cilium); Argo CD runs in insecure mode.
# No built-in ingress – HTTPRoute in httproute.yaml handles routing.

global:
  domain: argocd.westerweel.work

configs:
  params:
    # TLS is handled by the Gateway; Argo CD serves plain HTTP internally
    server.insecure: "true"
  # A scoped API account for the coding agent on agent-lxc (Mark 2026-11-13), so
  # deploy status, refresh and sync do not depend on the jump host. It may only
  # read and sync applications: no delete, no exec, no settings. Token in
  # OpenBao kv/homelab/argocd-agent.
  cm:
    accounts.agent: apiKey
  rbac:
    policy.csv: |
      p, role:agent-sync, applications, get, */*, allow
      p, role:agent-sync, applications, sync, */*, allow
      g, agent, role:agent-sync

server:
  ingress:
    enabled: false
