[project]
name = "secreport"
version = "0.1.0"
description = "Weekly security report for Mark's own public surface: bot traffic + self-scan (layer 1 passive, layer 2 active non-destructive)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "sslyze==6.3.1",
    "zaproxy==0.4.0",
    "maxminddb==2.8.2",
]

[project.scripts]
secreport = "secreport.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secreport"]
