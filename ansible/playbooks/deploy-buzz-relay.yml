---
# Provisioning voor de relay-VM van Ratatoskr (vm 109, .60): het besturings-
# systeem, Docker en de map /opt/buzz-relay. Meer niet.
#
# De stack zelf komt sinds 2026-09-11 uit MWest2020/ratatoskr, `deploy/`
# (compose + .env.example), en wordt uitgerold zoals docs/how-to/installeren.md
# daar beschrijft. Tot 2026-09-24 kopieerde dit playbook ook een eigen,
# vendored docker-compose.yml en deed het `up -d --force-recreate`: wie het nu
# nog had gedraaid, had de live installatie teruggezet naar een oude stack.
# Die stappen zijn eruit (ratatoskr-change opruimen-na-migratie).
#
# Geen Caddy/certbot: de relay is alleen via LAN + tailnet bereikbaar (ws://),
# transport-encryptie komt van Tailscale.
#
# Run:
#   ansible-playbook -i inventory/buzz-relay-hosts.yml playbooks/deploy-buzz-relay.yml -vv

- name: Deploy buzz-relay stack
  hosts: buzz_relay
  become: true
  tasks:
    - name: Wait for SSH + cloud-init readiness
      wait_for_connection:
        delay: 5
        timeout: 180

    - name: Recover any interrupted dpkg state
      command: dpkg --configure -a
      changed_when: false

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Ensure /etc/apt/keyrings exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
        state: present
        filename: docker

    - name: Install Docker engine + compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Ensure /opt/buzz-relay exists
      file:
        path: /opt/buzz-relay
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Announce next-step
      debug:
        msg:
          - "Host klaar: Docker en /opt/buzz-relay staan."
          - "De stack: MWest2020/ratatoskr deploy/ + docs/how-to/installeren.md."
          - "Route .60/32 adverteren: playbooks/configure-tailscale-routes.yml + console-approval."
