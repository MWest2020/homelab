---
# Tailscale Kubernetes operator. Joins tailnet-exposed Services (loadBalancerClass
# tailscale) to the tailnet. OAuth creds come from a pre-created Secret
# `operator-oauth` (keys client_id / client_secret) in the tailscale namespace —
# created out-of-band, never in Git. ServerSideApply for the operator CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.102.2
    helm:
      releaseName: tailscale-operator
      # oauth.* left empty on purpose → the chart uses the pre-created
      # operator-oauth Secret.
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
