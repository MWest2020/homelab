# jarvis — the voice bridge from Mark's phone to headless Claude Code
# (MWest2020/jarvis, docs/how-to/run-in-cluster.md). One pod: an init container
# clones/refreshes the projects read-only, the bridge holds faster-whisper and
# Kokoro (about 1.8 GB resident) and runs `claude -p` with Read/Glob/Grep only.
# Mark, 2026-11-14: "Dit moet 1 van de nodes worden."
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis
  labels: { app: jarvis }
spec:
  replicas: 1                     # session file and volume are local; one bridge
  strategy: { type: Recreate }    # RWO volume: the old pod must let go first
  selector:
    matchLabels: { app: jarvis }
  template:
    metadata:
      labels: { app: jarvis }
    spec:
      imagePullSecrets:
        - name: ghcr-pull   # private package; out-of-band, see README.md
      # No Kubernetes API token and no env vars for other Services: the bridge
      # needs neither, and Claude Code's tools should not find them.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # node-03 has the most memory headroom (about 12 GB of requests free on
      # 2026-11-14), node-02 next. Preferred, not required: the local-path
      # volume pins the pod to wherever it first lands anyway.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [node-03] }
            - weight: 50
              preference:
                matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [node-02] }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001          # the image's user jarvis
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: sync-projects
          image: ghcr.io/mwest2020/jarvis-bridge:sha-87bcad4@sha256:bcc263d611de7a8af7c5a29e73e08f5a1767a46810fed1b240c035baac821c41
          imagePullPolicy: IfNotPresent
          # state/ must exist before the bridge mounts it as a sub-path.
          command: ["sh", "-c", "mkdir -p -m 700 /data/state /data/state/home /data/state/jarvis && chmod 700 /data/state /data/state/home /data/state/jarvis && exec jarvis-sync-projects"]
          env:
            - { name: JARVIS_SYNC_DIR, value: /data/repos }
            # Every repository MWest2020 owns that the PAT can read (Mark,
            # 2026-11-15: "jarvis mag alle projecten"), listed through
            # GET /user/repos?affiliation=owner and filtered on owner.login, so
            # never an organisation's. Archived repos, forks and repos over
            # 500 MB are skipped and logged (jarvis add-project-list). On
            # 2026-11-15: 61 repos, 484 MB by the API, ~0.9 GB on disk.
            - { name: JARVIS_SYNC_REPOS, value: "*" }
            - { name: JARVIS_SYNC_OWNER, value: MWest2020 }
            - { name: JARVIS_SYNC_MAX_KB, value: "512000" }
            # Names (or owner/name) to keep off the phone, space-separated.
            # Default: none (waiting-on-mark, see the runbook).
            - { name: JARVIS_SYNC_EXCLUDE, value: "" }
            - { name: HOME, value: /tmp }
            # The PAT lives in this container only, never in the bridge's
            # environment (Claude Code's Read tool could read it there).
            - name: GIT_PAT
              valueFrom:
                secretKeyRef: { name: pat-node-01, key: GIT_PAT }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            # git index-pack of the larger shallow clones (a 237 MB tree).
            limits: { memory: 1Gi }
        # Full mode (jarvis-full-agent D32): the bridge's ssh key and the agent
        # host's pinned host key, copied 0400 and owned by uid 10001 into a
        # memory emptyDir only the bridge mounts. Secret jarvis-agent-key is
        # out-of-band (README.md); its volume is mounted in this container only.
        - name: agent-key
          image: ghcr.io/mwest2020/jarvis-bridge:sha-87bcad4@sha256:bcc263d611de7a8af7c5a29e73e08f5a1767a46810fed1b240c035baac821c41
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "install -m 0400 /secret/key /secret/known_hosts /agent/"]
          volumeMounts:
            - { name: agent-secret, mountPath: /secret, readOnly: true }
            - { name: agent-key, mountPath: /agent }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: bridge
          image: ghcr.io/mwest2020/jarvis-bridge:sha-87bcad4@sha256:bcc263d611de7a8af7c5a29e73e08f5a1767a46810fed1b240c035baac821c41
          imagePullPolicy: IfNotPresent
          env:
            # Listen on the pod IP behind the Tailscale proxy (run-bridge-in-
            # cluster D1); service.yaml + networkpolicy.yaml keep it tailnet-only.
            - { name: JARVIS_BEHIND_TAILSCALE_PROXY, value: "1" }
            - name: JARVIS_BIND_HOST
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - { name: JARVIS_PORT, value: "8787" }
            # Every checkout the init container left under /work is a project;
            # GET /projects lists them for the phone.
            - { name: JARVIS_PROJECTS, value: "*" }
            - { name: JARVIS_PROJECTS_ROOT, value: /work }
            - { name: JARVIS_STATE_DIR, value: /state/jarvis }
            - { name: HOME, value: /state/home }
            - name: JARVIS_TOKEN
              valueFrom:
                secretKeyRef: { name: jarvis-token, key: token }
            # Agent mode (jarvis-full-agent). full since 2026-11-16, after the agent host's
            # checks (task 1.17) pass; then full. The bridge reaches agent-lxc
            # over the LAN (pod -> 192.168.178.58:22, seen there as node-03,
            # 192.168.178.207, which the key's from= names; Mark accepted this
            # in jarvis #42). The pod stays on node-03 through its local-path PVC.
            - { name: JARVIS_AGENT_MODE, value: full }
            - { name: JARVIS_AGENT_HOST, value: "192.168.178.58" }
            - { name: JARVIS_AGENT_PORT, value: "22" }
            - { name: JARVIS_AGENT_USER, value: agent }
            - { name: JARVIS_AGENT_KEY_FILE, value: /agent/key }
            - { name: JARVIS_AGENT_KNOWN_HOSTS_FILE, value: /agent/known_hosts }
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: claude-oauth-token, key: token }
          ports:
            - { name: http, containerPort: 8787 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /work, subPath: repos, readOnly: true }
            - { name: data, mountPath: /state, subPath: state }
            - { name: tmp, mountPath: /tmp }
            - { name: agent-key, mountPath: /agent, readOnly: true }
          # No health route: the server only listens once both speech models
          # are loaded, so an open port means ready. The startup probe allows
          # ten minutes for that load on a busy node.
          startupProbe:
            tcpSocket: { port: 8787 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: 8787 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8787 }
            periodSeconds: 30
            failureThreshold: 4
          # Kokoro TTS and whisper are CPU-bound and were throttled at 2 CPUs
          # (642 of 1008 periods during two turns, 2026-11-16): TTS ran at
          # real time, 10-15 s a turn. node-03 has 4 vCPUs with 40% requested.
          # Memory reached 3.3 GB after a few turns and a second process
          # OOM-killed the container at 4Gi; 6Gi gives headroom while the
          # growth is investigated.
          resources:
            requests: { cpu: "1", memory: 3Gi }
            limits: { cpu: "4", memory: 6Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: jarvis-data }
        - name: tmp
          emptyDir: {}
        # 0444 inside this pod: only the agent-key init container mounts it,
        # and copies it 0400 for uid 10001 (no fsGroup, which would chown the
        # whole repos volume on every start).
        - name: agent-secret
          secret: { secretName: jarvis-agent-key, defaultMode: 0444 }
        - name: agent-key
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
