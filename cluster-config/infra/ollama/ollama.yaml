# Ollama — local embeddings (bge-m3) + optional RAG LLM. CPU-only (no GPU), slow.
# The instances are the StatefulSet in ollama-statefulset.yaml (two, pinned).
# This Service balances them; wordsworth reaches Ollama only through it.
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector: { app: ollama }
  ports:
    - { port: 11434, targetPort: 11434 }
  type: ClusterIP
