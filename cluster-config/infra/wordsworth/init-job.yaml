# Schema bootstrap. ArgoCD PreSync hook: runs (idempotently) before the API on
# every sync, so the tables + append-only audit trigger exist first.
apiVersion: batch/v1
kind: Job
metadata:
  name: wordsworth-init
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: wordsworth, job: init }
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: init
          # Gepind op DIGEST, niet op een tag. Ook `sha-<commit>` kan verplaatst
          # worden — niets houdt tegen dat die tag opnieuw naar andere bytes
          # gepubliceerd wordt. Bij een systeem dat persoonsgegevens verwerkt is
          # 'welke code heeft dit document gezien' een auditvraag. Zie ADR-0006
          # en scripts/pin_check.py in MWest2020/wordsworth.
          # Dit is exact dezelfde image als sha-d708df6 — een preciezere
          # verwijzing, GEEN upgrade. api en init-job blijven gelijk, anders
          # ontbreken de kolom-migraties.
          image: ghcr.io/mwest2020/wordsworth@sha256:2f7972cfdeee48db9a7c949b5919e77551c1b58627966191fd68f52aa91cccb8
          imagePullPolicy: IfNotPresent
          command: ["wordsworth-init"]
          # PreSync hook runs before the ConfigMap is synced; init_schema only
          # needs the DB URL, so depend on the secret alone.
          envFrom:
            - secretRef:    { name: wordsworth-db }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
