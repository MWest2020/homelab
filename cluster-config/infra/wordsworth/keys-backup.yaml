# Daily backup of wordsworth's `document_keys` table (ADR-0008): one row per
# sealed original with its wrapped data key. Without the row, a sealed original
# can never be opened again, so this is half of the deploy precondition of
# wordsworth's `originals-ingest-switch` (the other half: openbao-snapshot in
# the openbao namespace). Runbook: docusaurus/docs/runbooks/key-backups.md.
#
# Where it goes: the SeaweedFS bucket `wordsworth-key-backups`, replication 001
# (fs.configure on the bucket path, see the runbook),
# so a copy is on another node than the Postgres primary. Kept 30 days.
# The rows hold only wrapped keys: useless without OpenBao's KEK.
#
# Credentials are the existing out-of-band Secrets `wordsworth-db` (database
# URL) and `wordsworth-s3`; nothing new in git.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wordsworth-keys-backup
spec:
  schedule: "17 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: { app: wordsworth, job: keys-backup }
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: out
              emptyDir: { sizeLimit: 256Mi }
            - name: tmp
              emptyDir: { sizeLimit: 64Mi }
          initContainers:
            - name: dump
              image: postgres:17.10-alpine
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  url=$(printf '%s' "$WORDSWORTH_DATABASE_URL" | sed 's#^postgresql+psycopg://#postgresql://#')
                  f=/out/document_keys-$(date -u +%Y%m%dT%H%M%SZ).dump
                  pg_dump --dbname="$url" --format=custom --table=public.document_keys --file="$f"
                  rows=$(psql "$url" -tAc 'select count(*) from document_keys')
                  echo "$rows" > "$f.rows"
                  sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
                  echo "dumped document_keys: $rows rows, $(wc -c < "$f") bytes, sha256 $(cat "$f.sha256")"
              envFrom:
                - secretRef: { name: wordsworth-db }
              volumeMounts:
                - { name: out, mountPath: /out }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          containers:
            - name: upload
              image: amazon/aws-cli:2.31.18
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  S3="aws --endpoint-url $WORDSWORTH_S3_ENDPOINT_URL s3"
                  B=s3://wordsworth-key-backups
                  # Both CronJobs share the bucket; whichever runs first creates it.
                  $S3 ls "$B" >/dev/null 2>&1 || $S3 mb "$B" 2>/dev/null || $S3 ls "$B" >/dev/null
                  $S3 cp --recursive /out "$B/document_keys/" --only-show-errors
                  cutoff=$(date -u -d '30 days ago' +%Y%m%d)
                  $S3 ls "$B/document_keys/" | awk '{print $4}' | while read -r k; do
                    d=$(printf '%s' "$k" | sed -n 's/^document_keys-\([0-9]\{8\}\).*/\1/p')
                    [ -n "$d" ] && [ "$d" -lt "$cutoff" ] && $S3 rm "$B/document_keys/$k" --only-show-errors || true
                  done
                  echo "uploaded: $(ls /out | tr '\n' ' ')"
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: wordsworth-s3, key: WORDSWORTH_S3_ACCESS_KEY } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: wordsworth-s3, key: WORDSWORTH_S3_SECRET_KEY } }
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: WORDSWORTH_S3_ENDPOINT_URL
                  value: http://seaweedfs.seaweedfs.svc.cluster.local:8333
                - name: HOME
                  value: /tmp
              volumeMounts:
                - { name: out, mountPath: /out, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
