# Non-secret runtime config. DB URL + S3 keys come from the out-of-band Secrets
# wordsworth-db / wordsworth-s3 (never in Git).
apiVersion: v1
kind: ConfigMap
metadata:
  name: wordsworth-config
data:
  WORDSWORTH_OPENSEARCH_URL: "http://opensearch.opensearch.svc.cluster.local:9200"
  WORDSWORTH_OPENSEARCH_INDEX: "wordsworth"
  WORDSWORTH_OLLAMA_URL: "http://ollama.ollama.svc.cluster.local:11434"
  WORDSWORTH_EMBEDDING_MODEL: "bge-m3"
  WORDSWORTH_EMBEDDING_DIM: "1024"
  WORDSWORTH_LLM_MODEL: "llama3.2:3b"
  WORDSWORTH_OPENANONYMISER_URL: "http://openanonymiser.openanonymiser.svc.cluster.local:8080"
  WORDSWORTH_OPENANONYMISER_TIMEOUT: "180"
  WORDSWORTH_S3_ENDPOINT_URL: "http://minio.minio.svc.cluster.local:9000"
  WORDSWORTH_S3_BUCKET: "wordsworth"
  WORDSWORTH_S3_REGION: "us-east-1"
  WORDSWORTH_OCR_LANGUAGE: "nld"
  # Fase B: reversible pseudonymisation on. Data keys are OpenBao-Transit-wrapped;
  # the scoped token comes from the out-of-band Secret wordsworth-openbao.
  WORDSWORTH_REVERSIBLE: "true"
  WORDSWORTH_OPENBAO_URL: "http://openbao.openbao.svc.cluster.local:8200"
