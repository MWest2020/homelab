# Non-secret runtime config. DB URL + S3 keys come from the out-of-band Secrets
# wordsworth-db / wordsworth-s3 (never in Git).
apiVersion: v1
kind: ConfigMap
metadata:
  name: wordsworth-config
data:
  WORDSWORTH_OPENSEARCH_URL: "http://opensearch.opensearch.svc.cluster.local:9200"
  WORDSWORTH_OPENSEARCH_INDEX: "wordsworth"
  WORDSWORTH_OLLAMA_URL: "http://ollama.ollama.svc.cluster.local:11434"
  WORDSWORTH_EMBEDDING_MODEL: "bge-m3"
  WORDSWORTH_EMBEDDING_DIM: "1024"
  WORDSWORTH_LLM_MODEL: "llama3.2:3b"
  WORDSWORTH_OPENANONYMISER_URL: "http://openanonymiser.openanonymiser.svc.cluster.local:8080"
  WORDSWORTH_OPENANONYMISER_TIMEOUT: "180"
  WORDSWORTH_S3_ENDPOINT_URL: "http://seaweedfs.seaweedfs.svc.cluster.local:8333"
  WORDSWORTH_S3_BUCKET: "wordsworth"
  WORDSWORTH_S3_REGION: "us-east-1"
  WORDSWORTH_OCR_LANGUAGE: "nld"
  # Fase B: reversible pseudonymisation on. Data keys are OpenBao-Transit-wrapped;
  # the scoped token comes from the out-of-band Secret wordsworth-openbao.
  WORDSWORTH_REVERSIBLE: "true"
  WORDSWORTH_OPENBAO_URL: "http://openbao.openbao.svc.cluster.local:8200"
  # EUDI VC reveal-gate (ADR-0003) — TEST issuer. Public key is non-secret;
  # a presented X-VC narrows a reveal to grant ∩ vc.authorized_types.
  # REQUIRED=false keeps reveal grant-only when no VC is presented.
  WORDSWORTH_VC_ISSUER: "https://issuer.test.wordsworth"
  WORDSWORTH_VC_VCT: "https://wordsworth/eudi/reveal-authorization"
  WORDSWORTH_VC_REQUIRED: "false"
  # De sleutels van Keycloak rechtstreeks bij de buur in het cluster ophalen.
  #
  # Dit MOET expliciet: Keycloak adverteert in zijn eigen discovery-document een
  # PUBLIEKE jwks_uri, ook als je dat document intern opvraagt. Zonder deze
  # regel gaat de pod dus alsnog via Cloudflare en de eigen tunnel terug naar
  # binnen -- twee extra partijen voor een netwerkhop, en op 2026-09-20 gaf
  # Cloudflare daarop 403 omdat urllib geen User-Agent stuurde.
  #
  # De UITGEVER blijft de publieke naam: dat is wat in `iss` staat en dus wat
  # gecontroleerd wordt. Adres en identiteit zijn twee dingen.
  WORDSWORTH_OIDC_JWKS_URL: "http://keycloak.keycloak.svc.cluster.local:8080/realms/westerweel/protocol/openid-connect/certs"
  # Detectielijsten: allow.json/deny.json, mee in het image (lists/ in de repo).
  # Niet in een ConfigMap, want de content-hash hiervan staat in elk
  # de-identificatie-auditrecord en hoort terug te leiden naar een commit die
  # iemand heeft bekeken. Zie docs/how-to/detection-lists.md.
  WORDSWORTH_DETECTION_LISTS: "/app/lists"
  # F4-mitigatie: alleen deze caller-labels mogen de VOLLEDIGE
  # de-identified tekst lezen (/anonymized + /export/anonymized.zip).
  #
  # LET OP: een callerlabel is niet hetzelfde ding onder beide deuren. Met
  # WORDSWORTH_API_KEYS is het het label vóór de dubbele punt ("console"); met
  # Cloudflare Access is het het GEVERIFIEERDE E-MAILADRES uit het JWT. Toen we
  # op Access overgingen bleven "console,cli" staan, en dus weigerde deze lijst
  # iedereen -- ook de beheerder, die een kale JSON-403 kreeg op /console.
  WORDSWORTH_CORPUS_READ_LABELS: "console,cli,mark@westerweel.work"
  # Wie een reveal-grant mag uitgeven of intrekken. Een grant is de sleutel tot
  # klare PII, dus dit is een kleinere kring dan "iedereen met een api-key". LEEG
  # betekent hier bewust NIEMAND (anders dan bij corpus-read), dus deze regel moet
  # blijven staan zolang WORDSWORTH_API_KEYS gezet is — zie wordsworth#38.
  # Zelfde verhaal als hierboven: onder Access is dit een e-mailadres.
  WORDSWORTH_GRANT_ISSUER_LABELS: "console,cli,mark@westerweel.work"
  # access-identity: een geverifieerde Cloudflare Access-assertie wordt het
  # callerlabel, zodat het auditspoor een PERSOON noemt in plaats van een
  # sleutelbos. Beide waarden zijn nodig; een ervan alleen levert geen verifier
  # en dus geen identiteit (fail-closed).
  #
  # De aud is die van de Access-applicatie "wordsworth console" en hoort bij
  # DEZE applicatie: een geldig ondertekende assertie voor een andere app van
  # hetzelfde team is geen toegang tot deze.
  #
  # De api-sleutel blijft de weg naar binnen waar geen Access voor staat -- de
  # tailnet-route, API-clients, ingest. Geen assertie, geen identiteit, sleutel.
  WORDSWORTH_ACCESS_TEAM_DOMAIN: "raspy-wood-e123.cloudflareaccess.com"
  WORDSWORTH_ACCESS_AUD: "320841be57b2e469adbef09614573240756da5f3a188df87b6fb761d40e65d65"
  WORDSWORTH_VC_ISSUER_KEY_PEM: |
    -----BEGIN PUBLIC KEY-----
    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEaIStQ3hysyfmmJhpDTX+nx4kX1Sk
    k+faMvLyZnSeX85KEHpp/bykQ1BOzMjMsP8z54mcJ+zkkk8KDDH8St9B8A==
    -----END PUBLIC KEY-----

  # Browser frontend (Wordsworth Console on GitHub Pages) — opt-in CORS.
  WORDSWORTH_CORS_ALLOW_ORIGINS: "https://mwest2020.github.io"
