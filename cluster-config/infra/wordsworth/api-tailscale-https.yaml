# Tailnet-internal HTTPS exposure of the Wordsworth API for browser frontends.
# The Wordsworth Console (GitHub Pages, https) needs an https API or the browser
# blocks the call as mixed content. The Tailscale operator terminates TLS with a
# MagicDNS cert and names this Ingress `wordsworth-api` →
# https://wordsworth-api.<tailnet>.ts.net (443).
#
# TAILNET-ONLY. There is deliberately NO `tailscale.com/funnel` annotation, so
# this is never exposed to the public internet — it is sovereign PII infra and
# stays inside the tailnet. Since 2026-11-01 this is also the CLI endpoint: the
# old http :8000 LoadBalancer (api-tailscale.yaml, `wordsworth`/100.100.181.23)
# is gone (wordsworth #192, task 3.3.5).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordsworth-api-https
  annotations:
    tailscale.com/hostname: "wordsworth-api"
    # Served by the HA ProxyGroup (proxygroup.yaml) as svc:wordsworth-api on
    # two nodes, not by a dedicated single-pod proxy (wordsworth#192, 3.3.4).
    # The cert is shared through the Secret wordsworth-api.<tailnet>.ts.net in
    # the tailscale namespace. Rolling back: drop this annotation AND delete
    # that Secret, or the plain reconciler fails on it (incident 2026-10-29).
    tailscale.com/proxy-group: "wordsworth-ingress"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: wordsworth-api
      port:
        number: 8000
  tls:
    - hosts:
        - wordsworth-api   # operator expands to wordsworth-api.<tailnet>.ts.net
