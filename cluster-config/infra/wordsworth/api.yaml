# Wordsworth read API (state/metrics/search/hybrid/ask). Light: no in-process ML.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordsworth-api
  labels: { app: wordsworth, component: api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: wordsworth, component: api }
  template:
    metadata:
      labels: { app: wordsworth, component: api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          # Gepind op DIGEST, niet op een tag. Ook `sha-<commit>` kan verplaatst
          # worden — niets houdt tegen dat die tag opnieuw naar andere bytes
          # gepubliceerd wordt. Bij een systeem dat persoonsgegevens verwerkt is
          # 'welke code heeft dit document gezien' een auditvraag. Zie ADR-0006
          # en scripts/pin_check.py in MWest2020/wordsworth.
          # Dit is exact dezelfde image als sha-d708df6 — een preciezere
          # verwijzing, GEEN upgrade. api en init-job blijven gelijk, anders
          # ontbreken de kolom-migraties.
          image: ghcr.io/mwest2020/wordsworth@sha256:23a0048cb5b8865f7f91234525b7f5c7bfbcbc824a1a97988762b76723a57687
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # gunicorn 26 writes a control socket under $HOME/.gunicorn; the root
            # fs is read-only, so point HOME at the writable /tmp emptyDir.
            - { name: HOME, value: /tmp }
          envFrom:
            - configMapRef: { name: wordsworth-config }
            - secretRef:    { name: wordsworth-db }
            - secretRef:    { name: wordsworth-s3 }
            - secretRef:    { name: wordsworth-openbao }   # WORDSWORTH_OPENBAO_TOKEN (Fase B)
            - secretRef:    { name: wordsworth-apikeys }   # WORDSWORTH_API_KEYS (opt-in caller-auth)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            # Worker recycling is off (it dropped ingest batches), so give ample
            # memory to absorb a long run + the ~45MB outlier doc across 2 workers.
            # Nodes have 16Gi.
            requests: { cpu: "100m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "8Gi" }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wordsworth-api
spec:
  selector: { app: wordsworth, component: api }
  ports:
    - { port: 8000, targetPort: 8000 }
  type: ClusterIP
