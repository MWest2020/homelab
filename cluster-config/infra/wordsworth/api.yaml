# Wordsworth read API (state/metrics/search/hybrid/ask). Light: no in-process ML.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordsworth-api
  labels: { app: wordsworth, component: api }
spec:
  # Two replicas on two nodes (wordsworth change hoge-beschikbaarheid, step 2).
  # Safe because the api mounts no node-bound volume and its rate limits live
  # in Postgres, shared by both.
  replicas: 2
  selector:
    matchLabels: { app: wordsworth, component: api }
  template:
    metadata:
      labels: { app: wordsworth, component: api }
    spec:
      # Required, not preferred: two replicas on one node is one node's worth
      # of redundancy with twice the pods.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app: wordsworth, component: api }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          # Gepind op DIGEST, niet op een tag. Ook `sha-<commit>` kan verplaatst
          # worden — niets houdt tegen dat die tag opnieuw naar andere bytes
          # gepubliceerd wordt. Bij een systeem dat persoonsgegevens verwerkt is
          # 'welke code heeft dit document gezien' een auditvraag. Zie ADR-0006
          # en scripts/pin_check.py in MWest2020/wordsworth.
          # sha-cf03830. api en init-job blijven op dezelfde digest, anders
          # ontbreken de kolom-migraties.
          image: ghcr.io/mwest2020/wordsworth@sha256:991cfd074a4f58b624a95777efbf303c8c3c775a5af23773453ad995d5ba43a9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # gunicorn 26 writes a control socket under $HOME/.gunicorn; the root
            # fs is read-only, so point HOME at the writable /tmp emptyDir.
            - { name: HOME, value: /tmp }
            # Identiteit komt sinds 2026-09-20 uit Keycloak (realm westerweel)
            # in plaats van uit Cloudflare Access. De proxy ervoor bezorgt het
            # token; deze twee vertellen de app wiens handtekening geldt.
            - { name: WORDSWORTH_OIDC_ISSUER, value: "https://iam.westerweel.work/realms/westerweel" }
            - { name: WORDSWORTH_OIDC_AUDIENCE, value: "wordsworth" }
            # De sleutels halen we INTERN op. Via de publieke naam gaat het
            # verkeer het cluster uit naar Cloudflare en weer terug, en dat
            # gaf een 403 op de bot-regels (urllib stuurde geen User-Agent).
            # De uitgever blijft de publieke naam: dat staat in het token.
            - { name: WORDSWORTH_OIDC_JWKS_URL, value: "http://keycloak.keycloak.svc.cluster.local:8080/realms/westerweel/protocol/openid-connect/certs" }
          envFrom:
            - configMapRef: { name: wordsworth-config }
            - secretRef:    { name: wordsworth-db }
            - secretRef:    { name: wordsworth-s3 }
            - secretRef:    { name: wordsworth-openbao }   # WORDSWORTH_OPENBAO_TOKEN (Fase B)
            - secretRef:    { name: wordsworth-apikeys }   # WORDSWORTH_API_KEYS (opt-in caller-auth)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            # Worker recycling is off (it dropped ingest batches), so give ample
            # memory to absorb a long run + the ~45MB outlier doc across 2 workers.
            # Nodes have 16Gi.
            requests: { cpu: "100m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "8Gi" }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wordsworth-api
spec:
  selector: { app: wordsworth, component: api }
  ports:
    - { port: 8000, targetPort: 8000 }
  type: ClusterIP
---
# A drain never takes the last one.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wordsworth-api
  labels: { app: wordsworth, component: api }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: wordsworth, component: api }
