# Tailnet-intern (NIET publiek): de volledige server incl. REST-API op
# https://wanderer.<tailnet>.ts.net — voor CLI- en operatorgebruik vanaf
# de tailnet. Geen funnel-annotatie.
#
# Een Ingress en geen LoadBalancer-Service: de Tailscale-operator zet er
# dan TLS met een MagicDNS-certificaat voor. Een kale http-Service op
# poort 8080 werkt met curl, maar een browser probeert https en loopt
# vast — dat was precies de klacht.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wanderer-ts
  annotations:
    tailscale.com/hostname: "wanderer"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: wanderer
      port:
        number: 8080
  tls:
    - hosts:
        - wanderer
