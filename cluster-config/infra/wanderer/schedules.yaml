# Scanschema voor de publieke demo-instantie.
#
# Waarom deze doelen: Wanderer meet de extern zichtbare voetafdruk van
# Nederlandse publieke organisaties, en dit zijn publieke websites van
# precies dat soort organisaties. Alle waarneming is passief en niet te
# onderscheiden van een gewone bezoeker (RDAP, DNS, TLS, één HTTPS-GET
# per pad, security.txt). Geen SMTP, geen brute force, geen scraping.
#
# De tijden lopen uiteen zodat de vier scans elkaar niet in de weg
# zitten; elk doel wordt één keer per week gescand. Wil je een ander
# rijtje: pas dit bestand aan, ArgoCD synct het en `wanderer serve`
# herleest het schema bij SIGHUP (of een herstart van de pod).
apiVersion: v1
kind: ConfigMap
metadata:
  name: wanderer-schedules
data:
  schedules.yaml: |
    schedules:
      - name: rijksoverheid
        cron: "17 3 * * 1"
        target:
          domain: rijksoverheid.nl
      - name: ncsc
        cron: "17 4 * * 1"
        target:
          domain: ncsc.nl
      - name: digid
        cron: "17 5 * * 1"
        target:
          domain: digid.nl
      # Het demodomein: wekelijks, zodat /demo altijd een recente meting
      # toont. Zonder schema zou de demopagina blijven hangen op de laatste
      # handmatige scan.
      - name: westerweel
        cron: "17 2 * * 1"
        target:
          domain: westerweel.work
      # Onze eigen namen staan op hetzelfde schema als de doelen die we
      # voor anderen bekijken (change cloudflare-afhankelijkheid, besluit
      # 2026-09-21: we blijven voorlopig bij Cloudflare, maar we meten het
      # wel). Anders verdwijnt een afhankelijkheid uit beeld omdat je hem
      # kent.
      - name: iam
        cron: "17 7 * * 1"
        target:
          domain: iam.westerweel.work
      - name: wordsworth
        cron: "17 8 * * 1"
        target:
          domain: wordsworth.westerweel.work
      - name: netnl-api
        cron: "17 9 * * 1"
        target:
          domain: api.westerweel.work
      - name: mijnoverheid
        cron: "17 6 * * 1"
        target:
          domain: mijnoverheid.nl
