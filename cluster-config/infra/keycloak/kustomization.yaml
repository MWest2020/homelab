apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
configMapGenerator:
  - name: keycloak-realm
    files:
      - realm-westerweel.json
    options:
      disableNameSuffixHash: true
  # The proxy's config gets a hash suffix, so a change rolls the pods.
  # (A per-generator `false` can't override a global `true`, hence no
  # global generatorOptions.)
  - name: keycloak-edge
    files:
      - edge-proxy.conf

resources:
  - keycloak.yaml
  - tunnel.yaml
  - edge-proxy.yaml
  - realm-sync-job.yaml
