# keycloak-edge: the only way from the public tunnel (iam.westerweel.work)
# to Keycloak. See edge-proxy.yaml for why it exists; the runbook
# (docusaurus/docs/runbooks/keycloak.md) has the allow-list in prose.
#
# Two gates, both must pass, otherwise 404:
#   1. the RAW path (as the client sent it) is canonical: no dot segments,
#      no empty segments, no `;` or `\`, and percent-encoding only for bytes
#      that cannot change the path's structure. So encoded dots, slashes,
#      backslashes, semicolons, `%25` (double encoding), control bytes and
#      bytes >= 0x80 are refused.
#   2. the NORMALISED path ($uri: decoded once, dot segments resolved) is on
#      the allow-list.
# Because of gate 1, decoding can't add or remove a path segment, so what
# gate 2 approves is the same path Keycloak will route. The request goes on
# to Keycloak unchanged (proxy_pass without a URI part).

log_format edge '$kc_client_ip "$request_method $kc_raw_path" $status $body_bytes_sent '
                '$request_time "$http_user_agent"';

# Path part of the request line, exactly as received.
map $request_uri $kc_raw_path {
    "~^(?<p>[^?]*)"  $p;
}

# Gate 1. First matching regex wins; every listed pattern refuses.
map $kc_raw_path $kc_raw_ok {
    default                                  1;
    "~[^A-Za-z0-9._~!$&'()*+,=:@/%-]"        0;  # ; \ space quotes control chars, anything unusual
    "~*%(2e|2f|5c|25|3b|[01][0-9a-f]|7f|[89a-f][0-9a-f])"  0;  # encoded . / \ % ; control, non-ASCII
    "~%(?![0-9A-Fa-f]{2})"                   0;  # malformed escape (%u002e, trailing %)
    "~//"                                    0;  # empty segment
    "~/\.\.?(/|$)"                           0;  # dot segment
}

# Gate 2. Case-sensitive, anchored. Realm westerweel only (the realm the
# wordsworth and wanderer clients live in); never master, never /admin.
map $uri $kc_path_ok {
    default                                                                   0;
    "~^/realms/westerweel/\.well-known/openid-configuration$"                 1;
    "~^/realms/westerweel/protocol/openid-connect/(auth|token|certs|userinfo|logout|logout/logout-confirm|login-status-iframe\.html|login-status-iframe\.html/init|3p-cookies/step[12]\.html)$"  1;
    "~^/realms/westerweel/login-actions/[a-z-]+$"                             1;
    "~^/realms/westerweel/account(/[A-Za-z0-9._~@:-]+)*/?$"                   1;
    "~^/resources/[A-Za-z0-9._-]+/(login|account|common)/[A-Za-z0-9._~@:/-]+$" 1;
    "~^/js/[A-Za-z0-9._~@:/-]+$"                                              1;
}

# Keycloak trusts X-Forwarded-For (KC_PROXY_HEADERS=xforwarded). Cloudflare
# sets Cf-Connecting-Ip itself, a client can't choose it; a client-supplied
# X-Forwarded-For is dropped. In-cluster callers get their pod IP.
map $http_cf_connecting_ip $kc_client_ip {
    ""       $remote_addr;
    default  $http_cf_connecting_ip;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    access_log /dev/stdout edge;

    client_max_body_size 1m;
    large_client_header_buffers 4 16k;

    # Requests nginx itself rejects as malformed: still a plain 404.
    error_page 400 =404 /__edge_404;

    if ($kc_raw_ok = 0) { return 404; }
    if ($kc_path_ok = 0) { return 404; }

    location = /__edge_404 {
        internal;
        return 404;
    }

    location / {
        proxy_pass http://keycloak-server.keycloak.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $kc_client_ip;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}

# Probes only; this port is not in the Service.
server {
    listen 8081;
    access_log off;
    location = /healthz { return 200 "ok\n"; }
    location / { return 404; }
}
