# Cloudflare Tunnel voor Keycloak — https://iam.westerweel.work.
#
# Origin (remote config bij Cloudflare): http://keycloak.keycloak.svc.cluster.local:8080.
# Die Service is sinds homelab#84 de filterende proxy keycloak-edge
# (edge-proxy.yaml), niet Keycloak zelf. De padregels bij Cloudflare
# (^/realms/, ^/resources/, ^/js/) staan er nog, maar zijn geen grens:
# een gecodeerd pad glipt erlangs. De proxy is de grens. De beheerconsole
# bereik je alleen over de tailnet (https://keycloak.<tailnet>.ts.net).
#
# Run-token: out-of-band Secret `keycloak-tunnel` (key TUNNEL_TOKEN),
# nooit in Git. Instellingen overgenomen van netnl/wordsworth (twee
# replica's, http2, DNS over TCP, ndots 2) — die komen uit echte
# storingen, zie cluster-config/infra/netnl/tunnel.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-tunnel
  labels: { app: keycloak, component: tunnel }
  annotations:
    # After the `keycloak` Service has switched to the edge proxy (wave 0).
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels: { app: keycloak, component: tunnel }
  template:
    metadata:
      labels: { app: keycloak, component: tunnel }
      annotations:
        # Changing this restarts cloudflared. Cilium picks a Service backend
        # when a socket connects, so keep-alive connections from before the
        # switch would otherwise keep reaching Keycloak directly (homelab#84).
        homelab/origin: keycloak-edge
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: keycloak, component: tunnel }
      dnsPolicy: ClusterFirst
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.0.0.1
        options:
          - { name: ndots, value: "2" }
          - { name: use-vc }
          - { name: attempts, value: "3" }
          - { name: timeout, value: "2" }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.2
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: { name: keycloak-tunnel, key: TUNNEL_TOKEN }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 15
          resources:
            requests: { cpu: "5m",   memory: "32Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
