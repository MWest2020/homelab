# Netwerklogboek per node: elke 30 s CPU, load en netwerkverkeer van de node zelf.
# Aanleiding 2026-09-28: vijf keer in vijf dagen vielen alle Cloudflare-tunnels
# tegelijk om, en de switch van dit cluster hangt aan een wifi-extender. Het cluster
# had geen metrics (geen Prometheus), dus bij een storing was niet te zien welke node
# er op dat moment data doorheen duwde. Tegenhanger van scripts/netlog.sh op agent-lxc.
#
# Lezen:  kubectl -n netlog logs -l app=netlog --prefix --since=2h
# Regel:  <tijd> <node> load1=… cpu=…% rx=… tx=… Mbit/s (hoofdinterface van de node)
#
# hostNetwork is nodig om de tellers van de NODE te zien in plaats van die van de pod.
# Image staat al op elke node (curlimages/curl), dus geen download over de extender.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netlog
  labels: { app: netlog }
spec:
  selector:
    matchLabels: { app: netlog }
  template:
    metadata:
      labels: { app: netlog }
    spec:
      hostNetwork: true
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: netlog
          image: curlimages/curl:8.16.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              ifc=$(awk '$2=="00000000" {print $1; exit}' /proc/net/route)
              read_cpu() { awk '/^cpu / {t=0; for(i=2;i<=NF;i++) t+=$i; print t, $5+$6}' /proc/stat; }
              read_net() { awk -v i="$ifc:" '$1==i {print $2, $10}' /proc/net/dev; }
              set -- $(read_cpu) $(read_net); t0=$1 i0=$2 r0=$3 x0=$4
              while true; do
                sleep 30
                set -- $(read_cpu) $(read_net); t1=$1 i1=$2 r1=$3 x1=$4
                awk -v t="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -v n="$NODE" -v l="$(cut -d' ' -f1 /proc/loadavg)" \
                    -v dt=$((t1-t0)) -v di=$((i1-i0)) -v dr=$((r1-r0)) -v dx=$((x1-x0)) -v ifc="$ifc" \
                    'BEGIN { printf "%s %s load1=%s cpu=%.0f%% rx=%.2f tx=%.2f Mbit/s (%s)\n", t, n, l, (dt>0 ? 100*(dt-di)/dt : 0), dr*8/30/1e6, dx*8/30/1e6, ifc }'
                t0=$t1 i0=$i1 r0=$r1 x0=$x1
              done
          env:
            - name: NODE
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "5m", memory: "8Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
