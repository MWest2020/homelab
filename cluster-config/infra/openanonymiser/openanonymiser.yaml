# OpenAnonymiser GLiNER service (PII entity redaction over HTTP). Model baked
# into the image (HF_HUB_OFFLINE=1) — no runtime download. CPU-only, slow.
# Wordsworth reaches it at http://openanonymiser.openanonymiser.svc:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openanonymiser
  labels: { app: openanonymiser }
spec:
  # One replica per worker node (nodes are 1 CPU each). A document's independent
  # anonymize chunks fan out one-per-replica, so the pipeline uses the cluster's
  # aggregate CPU instead of a single core. Chunking bounds each call's memory.
  replicas: 3
  # One pod per node (anti-affinity) with exactly 3 nodes means a rolling update
  # must never surge a 4th pod — it would be unschedulable and deadlock the
  # rollout. Recreate one node's pod at a time: free it first, then reschedule.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: openanonymiser }
  template:
    metadata:
      labels: { app: openanonymiser }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: openanonymiser }
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/mwest2020/openanonymiser-light:v1.3.0@sha256:be403e88abf16da1da42b9eae7547df22b199174a9ff23b73fee4b34ae421107
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - { name: UVICORN_SERVER_MODE, value: production }
            - { name: DEFAULT_SPACY_MODEL, value: nl_core_news_lg }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:            # model load ~1-3 min on CPU
            httpGet: { path: /api/v1/health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 40
          # A single CPU worker blocks /api/v1/health for the whole GLiNER
          # forward pass; even a 10s HTTP-probe timeout still flapped under load,
          # so busy replicas were pulled from the Service endpoints and callers
          # hit "No route to host" (EHOSTUNREACH) → retry churn that dragged the
          # corpus backfill to a crawl. Once the model is loaded the process is
          # "ready" whenever it accepts connections, so use a TCP probe: a busy
          # pod stays in the endpoints and callers just wait for the worker.
          # startupProbe (httpGet above) still gates on the model actually
          # loading; liveness is TCP too so an inferring-but-alive pod is never
          # killed (a truly hung process stops accepting connections).
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 20
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 30
            failureThreshold: 6
          resources:
            # Driver-side chunking (≤4k chars/call) bounds GLiNER's O(n^2)
            # attention spike, so the whole-document OOM (75 restarts at 6Gi) is
            # gone and the huge memory headroom is no longer needed. Modest
            # limits let three replicas co-exist with OpenSearch/Ollama/Postgres
            # on the 16Gi worker nodes. CPU limit is 1 (that is all a node has).
            requests: { cpu: "250m", memory: "1Gi" }
            limits:   { cpu: "1",    memory: "4Gi" }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openanonymiser
spec:
  selector: { app: openanonymiser }
  ports:
    - { port: 8080, targetPort: 8080 }
  type: ClusterIP
