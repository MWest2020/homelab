# OpenAnonymiser GLiNER service (PII entity redaction over HTTP). Model baked
# into the image (HF_HUB_OFFLINE=1) — no runtime download. CPU-only, slow.
# Wordsworth reaches it at http://openanonymiser.openanonymiser.svc:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openanonymiser
  labels: { app: openanonymiser }
spec:
  # One replica per worker node (nodes are 1 CPU each). A document's independent
  # anonymize chunks fan out one-per-replica, so the pipeline uses the cluster's
  # aggregate CPU instead of a single core. Chunking bounds each call's memory.
  replicas: 3
  selector:
    matchLabels: { app: openanonymiser }
  template:
    metadata:
      labels: { app: openanonymiser }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: openanonymiser }
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/mwest2020/openanonymiser-light:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - { name: UVICORN_SERVER_MODE, value: production }
            - { name: DEFAULT_SPACY_MODEL, value: nl_core_news_lg }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:            # model load ~1-3 min on CPU
            httpGet: { path: /api/v1/health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 40
          # A single CPU worker blocks /health while it runs a GLiNER forward
          # pass (seconds). The k8s default probe timeout is 1s, so a busy pod
          # failed readiness, got pulled from the Service endpoints, and the
          # next anonymize chunk hit "No route to host" (EHOSTUNREACH). Give the
          # probes a generous timeout + failureThreshold so an inferring-but-
          # alive pod is never yanked; liveness only restarts a truly hung one.
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 12
          resources:
            # Driver-side chunking (≤4k chars/call) bounds GLiNER's O(n^2)
            # attention spike, so the whole-document OOM (75 restarts at 6Gi) is
            # gone and the huge memory headroom is no longer needed. Modest
            # limits let three replicas co-exist with OpenSearch/Ollama/Postgres
            # on the 16Gi worker nodes. CPU limit is 1 (that is all a node has).
            requests: { cpu: "250m", memory: "1Gi" }
            limits:   { cpu: "1",    memory: "4Gi" }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openanonymiser
spec:
  selector: { app: openanonymiser }
  ports:
    - { port: 8080, targetPort: 8080 }
  type: ClusterIP
