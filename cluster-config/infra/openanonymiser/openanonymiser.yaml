# OpenAnonymiser GLiNER service (PII entity redaction over HTTP). Model baked
# into the image (HF_HUB_OFFLINE=1) — no runtime download. CPU-only, slow.
# Wordsworth reaches it at http://openanonymiser.openanonymiser.svc:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openanonymiser
  labels: { app: openanonymiser }
spec:
  replicas: 1
  selector:
    matchLabels: { app: openanonymiser }
  template:
    metadata:
      labels: { app: openanonymiser }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/mwest2020/openanonymiser-light:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - { name: UVICORN_SERVER_MODE, value: production }
            - { name: DEFAULT_SPACY_MODEL, value: nl_core_news_lg }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:            # model load ~1-3 min on CPU
            httpGet: { path: /api/v1/health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 40
          # A single CPU worker blocks /health while it runs a GLiNER forward
          # pass (seconds). The k8s default probe timeout is 1s, so a busy pod
          # failed readiness, got pulled from the Service endpoints, and the
          # next anonymize chunk hit "No route to host" (EHOSTUNREACH). Give the
          # probes a generous timeout + failureThreshold so an inferring-but-
          # alive pod is never yanked; liveness only restarts a truly hung one.
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 12
          resources:
            # GLiNER does a single forward pass over the whole doc text (up to
            # ~34k chars seen); O(n^2) attention spikes memory → OOMKilled at 6Gi
            # (75 restarts). Raise headroom; nodes have 16Gi. Driver-side chunking
            # is the structural follow-up if this still isn't enough.
            requests: { cpu: "250m", memory: "4Gi" }
            limits:   { cpu: "2",    memory: "12Gi" }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openanonymiser
spec:
  selector: { app: openanonymiser }
  ports:
    - { port: 8080, targetPort: 8080 }
  type: ClusterIP
