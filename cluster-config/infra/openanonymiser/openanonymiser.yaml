# OpenAnonymiser GLiNER service (PII entity redaction over HTTP). Model baked
# into the image (HF_HUB_OFFLINE=1) — no runtime download. CPU-only, slow.
# Wordsworth reaches it at http://openanonymiser.openanonymiser.svc:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openanonymiser
  labels: { app: openanonymiser }
spec:
  replicas: 1
  selector:
    matchLabels: { app: openanonymiser }
  template:
    metadata:
      labels: { app: openanonymiser }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/mwest2020/openanonymiser-light:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - { name: UVICORN_SERVER_MODE, value: production }
            - { name: DEFAULT_SPACY_MODEL, value: nl_core_news_lg }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:            # model load ~1-3 min on CPU
            httpGet: { path: /api/v1/health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { cpu: "250m", memory: "3Gi" }
            limits:   { cpu: "2",    memory: "6Gi" }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openanonymiser
spec:
  selector: { app: openanonymiser }
  ports:
    - { port: 8080, targetPort: 8080 }
  type: ClusterIP
