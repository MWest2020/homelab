# OpenBao single-node (raft) StatefulSet. Starts SEALED + UNINITIALISED: the
# operator runs `bao operator init` + `unseal` out-of-band (crown-jewel material
# never lives in git or the cluster). tcpSocket probes so the pod is Ready while
# sealed, allowing the operator to exec in and initialise it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  labels: { app: openbao }
spec:
  serviceName: openbao-internal
  replicas: 1
  selector:
    matchLabels: { app: openbao }
  template:
    metadata:
      labels: { app: openbao }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000       # the image defaults to root; run as an arbitrary
        runAsGroup: 1000      # non-root uid, with the data PVC group-writable
        fsGroup: 1000         # (fsGroup) — OpenBao needs no specific uid.
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: openbao
          image: openbao/openbao:2.2.0
          imagePullPolicy: IfNotPresent
          command: ["bao", "server", "-config=/openbao/config/config.hcl"]
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: BAO_API_ADDR
              value: "http://$(POD_IP):8200"
            - name: BAO_CLUSTER_ADDR
              value: "http://$(POD_IP):8201"
          ports:
            - { name: api, containerPort: 8200 }
            - { name: cluster, containerPort: 8201 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          # Lab auto-unseal: after a restart OpenBao comes up sealed; this hook
          # waits for the server, then unseals with the key from the (out-of-band)
          # openbao-keys Secret so the straat self-heals. It always exits 0 (a
          # failed unseal must not kill the container — liveness is tcpSocket, so
          # a sealed-but-alive pod survives for manual unseal). The Secret is
          # optional so the pod still boots before bootstrap. This trades the
          # ADR-0002 offline-escrow ideal for lab resilience; prod (alma) uses
          # real auto-unseal (Transit/HSM) instead of a mounted unseal key.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    export BAO_ADDR=http://127.0.0.1:8200
                    K=/openbao/unseal/unseal_key
                    for i in $(seq 1 60); do
                      bao status >/dev/null 2>&1; s=$?
                      [ "$s" = "0" ] && exit 0            # already unsealed
                      if [ "$s" = "2" ] && [ -s "$K" ]; then   # up but sealed
                        bao operator unseal "$(cat "$K")" >/dev/null 2>&1 && exit 0
                      fi
                      sleep 2
                    done
                    exit 0
          volumeMounts:
            - { name: config, mountPath: /openbao/config, readOnly: true }
            - { name: data, mountPath: /openbao/data }
            - { name: unseal, mountPath: /openbao/unseal, readOnly: true }
          readinessProbe:
            tcpSocket: { port: 8200 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8200 }
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: config
          configMap: { name: openbao-config }
        - name: unseal
          secret:
            secretName: openbao-keys        # out-of-band; created at bootstrap
            optional: true                  # pod still boots before bootstrap
            items:
              - { key: unseal_key, path: unseal_key }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
