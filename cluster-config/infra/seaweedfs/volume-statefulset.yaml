# Two more SeaweedFS volume servers, each on its own node (required
# anti-affinity against every volume server), with their own local-path
# volumes. With seaweedfs-volume-data that is one per worker node. Every volume
# is replicated 001 (a copy on another server), and with three servers a node
# can go away and new volumes still find two servers to grow on, so writes keep
# working. Replication of the existing volumes is master and filer state, not a
# manifest: see docusaurus/docs/runbooks/seaweedfs.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs-volume
spec:
  serviceName: seaweedfs-volume
  replicas: 2
  selector:
    matchLabels:
      app: seaweedfs-volume
  template:
    metadata:
      labels:
        app: seaweedfs-volume
        seaweedfs/role: volume
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  seaweedfs/role: volume
      containers:
        - name: volume
          image: chrislusf/seaweedfs:4.39
          args:
            - volume
            - -mserver=seaweedfs-master-0.seaweedfs-master-peers:9333,seaweedfs-master-1.seaweedfs-master-peers:9333,seaweedfs-master-2.seaweedfs-master-peers:9333
            - -dir=/data
            - -port=8080
            - -max=10
            # Stop writing before the node's OS disk fills.
            - -minFreeSpace=10
            - -ip=$(POD_IP)
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 18080 }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
