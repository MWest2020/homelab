# The first volume server: the former all-in-one pod's volume (PVC
# seaweedfs-data, local-path on node-01), now a plain volume server. The
# volumes stay where they are; nothing is copied. The all-in-one's filer
# leveldb (filerldb2/) and master state (m9333/) stay untouched on the same
# volume as the rollback path (runbook seaweedfs-ha-migration.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-volume-data
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO-PVC
  selector:
    matchLabels:
      app: seaweedfs-volume-data
  template:
    metadata:
      labels:
        app: seaweedfs-volume-data
        seaweedfs/role: volume
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  seaweedfs/role: volume
      containers:
        - name: volume
          image: chrislusf/seaweedfs:4.39
          args:
            - volume
            - -mserver=seaweedfs-master-0.seaweedfs-master-peers:9333,seaweedfs-master-1.seaweedfs-master-peers:9333,seaweedfs-master-2.seaweedfs-master-peers:9333
            - -dir=/data
            - -port=8080
            # The all-in-one had 14 slots here; 10 are in use.
            - -max=14
            # Stop writing before the node's OS disk fills.
            - -minFreeSpace=10
            - -ip=$(POD_IP)
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 18080 }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
