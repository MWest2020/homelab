# convergence — the game's site (/) and the RPG demo (/play-rpg/), devnet only
# (MWest2020/convergence, docs/how-to/deploy.md). One pod, two containers:
# nginx (web, :8080) serves the site and proxies /play-rpg/, /parties/ and
# /healthz to the RPG-JS game server (rpg, :8790), so site, demo and WebSocket
# share one origin. The first demo's game server (server, :8787, /play/ and
# /ws) was retired on 2026-11-11; /play redirects to /play-rpg/ in nginx.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convergence
  labels: { app: convergence }
spec:
  replicas: 1               # the game state lives in the rpg process; one
  strategy: { type: Recreate }   # world, one pod
  selector:
    matchLabels: { app: convergence }
  template:
    metadata:
      labels: { app: convergence }
    spec:
      imagePullSecrets:
        - name: ghcr-pull   # private packages; out-of-band, see README.md
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/mwest2020/convergence-web:sha-30a2d79@sha256:894cfbbf62eb8a64b1fa76abf2a54057857e5ae7f69556ec8532be5e7e267b95
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 101    # nginx-unprivileged
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # pid file and temp paths
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
        - name: rpg
          image: ghcr.io/mwest2020/convergence-rpg:sha-30a2d79@sha256:7eeb2b7dc19eeb8a52a0b1dc6dca0e2ebb3f68e08da8a1b8ebc432f05b48c968
          imagePullPolicy: IfNotPresent
          env:
            - { name: PORT, value: "8790" }
            - { name: HOME, value: /tmp }
          ports:
            - containerPort: 8790
          securityContext:
            runAsUser: 1000   # the image's USER node
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: rpg-tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /healthz, port: 8790 }
            periodSeconds: 10
          # The game server is one Node process: when it dies or hangs the
          # kubelet restarts the container (the game world starts fresh).
          livenessProbe:
            httpGet: { path: /healthz, port: 8790 }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rpg-tmp
          emptyDir: {}
