# convergence — the game's site (/) and 2D demo (/play/) with its
# server-authoritative game server, devnet only (MWest2020/convergence,
# docs/how-to/deploy.md). One pod: nginx (web) proxies /ws to the game server
# on 127.0.0.1:8787, so site, demo and WebSocket share one origin. Since
# 2026-11-10 also the RPG-JS spike (rpg container, :8790): nginx proxies
# /play-rpg/ and /parties/ to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convergence
  labels: { app: convergence }
spec:
  replicas: 1               # the game state lives in the server process; one
  strategy: { type: Recreate }   # world, one pod
  selector:
    matchLabels: { app: convergence }
  template:
    metadata:
      labels: { app: convergence }
    spec:
      imagePullSecrets:
        - name: ghcr-pull   # private packages; out-of-band, see README.md
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: ghcr.io/mwest2020/convergence-server:sha-6ad35d6@sha256:a89b04bd3519ea714df513b37e6ed7af7d4481b4f68a47b8b517bb26676cece4
          imagePullPolicy: IfNotPresent
          env:
            - { name: PORT, value: "8787" }
          ports:
            - containerPort: 8787
          securityContext:
            runAsUser: 1000   # the image's USER node, numeric for runAsNonRoot
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /healthz, port: 8787 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
        - name: web
          image: ghcr.io/mwest2020/convergence-web:sha-067d06e@sha256:76ac904ad00e53e2ee7ffaf774b9b246fb1a2dee72f374f1b1b4e6b26be59337
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 101    # nginx-unprivileged
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # pid file and temp paths
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
        - name: rpg
          image: ghcr.io/mwest2020/convergence-rpg:sha-3268ec5@sha256:084bc4970c4c90b3fe65dcfbf19fcdc76c8d51b6bbf9a09427e08b1bb788059f
          imagePullPolicy: IfNotPresent
          env:
            - { name: PORT, value: "8790" }
            - { name: HOME, value: /tmp }
          ports:
            - containerPort: 8790
          securityContext:
            runAsUser: 1000   # the image's USER node
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: rpg-tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /healthz, port: 8790 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rpg-tmp
          emptyDir: {}
