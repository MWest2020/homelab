# Non-secret runtime config for the netnl facade. The upstream credential
# (NETNL_UPSTREAM_USERNAME / NETNL_UPSTREAM_PASSWORD) lives ONLY in the
# out-of-band Secret `netnl-upstream` — never in Git. See README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: netnl-config
data:
  # Provenance name, stamped on every reply (X-Netnl-Instance). Public-facing.
  NETNL_INSTANCE: "netnl"

  # The upstream batch instance on the VPS, reached over the tailnet — the VPS
  # does NOT publish its batch API publicly (443 staat daar alleen open op de
  # tailscale-interface). De hostnaam is verplicht: de instance-nginx doet
  # strikte SNI en serveert het Let's Encrypt-cert voor precies deze naam.
  # In-cluster wijst een hostAliases-entry op de Deployment deze naam naar het
  # gepinde ClusterIP van netnl-upstream-egress (upstream-egress.yaml), dat via
  # de tailscale-operator naar 100.65.70.52 (netnl-instance) proxied. See
  # docs/how-to/deploy-instance-vps.md in the internetnl-cli repo.
  NETNL_UPSTREAM_ENDPOINT: "https://netnl.westerweel.work/api/batch/v2"

  NETNL_DB: "/data/netnl.sqlite3"
  NETNL_HOST: "0.0.0.0"
  NETNL_PORT: "8000"

  # Limits and retention use the app defaults unless set here (all tunable):
  # NETNL_RATE_LIMIT (10/h), NETNL_MAX_DOMAINS (500), NETNL_MAX_CONCURRENT (2),
  # NETNL_RESULT_RETENTION_DAYS (7), NETNL_AUDIT_RETENTION_DAYS (90),
  # NETNL_RESERVING_GRACE_SECONDS (300). Adjust once beta capacity is known.
