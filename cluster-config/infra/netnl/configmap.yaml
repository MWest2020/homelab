# Non-secret runtime config for the netnl facade. The upstream credential
# (NETNL_UPSTREAM_USERNAME / NETNL_UPSTREAM_PASSWORD) lives ONLY in the
# out-of-band Secret `netnl-upstream` — never in Git. See README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: netnl-config
data:
  # Provenance name, stamped on every reply (X-Netnl-Instance). Public-facing.
  NETNL_INSTANCE: "netnl"

  # The upstream batch instance on the VPS, reached over the tailnet — the VPS
  # does NOT publish its batch API publicly (443 staat daar alleen open op de
  # tailscale-interface). De hostnaam is verplicht: de instance-nginx doet
  # strikte SNI en serveert het Let's Encrypt-cert voor precies deze naam.
  # In-cluster wijst een hostAliases-entry op de Deployment deze naam naar het
  # gepinde ClusterIP van netnl-upstream-egress (upstream-egress.yaml), dat via
  # de tailscale-operator naar 100.65.70.52 (netnl-instance) proxied. See
  # docs/how-to/deploy-instance-vps.md in the internetnl-cli repo.
  NETNL_UPSTREAM_ENDPOINT: "https://netnl.westerweel.work/api/batch/v2"

  # Serveert /.well-known/security.txt (RFC 9116) — opt-in; zonder deze
  # var bestaat de route niet (501 zoals elk niet-geproxied pad).
  NETNL_SECURITY_CONTACT: "mailto:mark@conduction.nl"

  # Live demo-runs op de publieke demo-pagina (openspec add-demo-run):
  # anoniem, drievoudig begrensd; kill switch = netnl-admin user revoke
  # netnl-demo, weer aan = user reissue. Zie docs/how-to/demo-run.md.
  NETNL_DEMO_ENABLED: "1"
  NETNL_DEMO_ALLOWED_ORIGIN: "https://mwest2020.github.io"
  NETNL_DEMO_TENANT: "netnl-demo"

  # Supporter bridge (openspec add-supporter-issuance): a live donation mints
  # a key only at or above this amount, in the BMC account's currency. Owner
  # decision 2026-09-04 (was 0 = every donation); the code default follows in
  # openspec polish-supporter-mail. The webhook/SMTP secrets live ONLY in the
  # out-of-band Secret `netnl-bridge`.
  NETNL_SUPPORTER_MIN_AMOUNT: "2"

  # Bazibo web unlock codes (internetnl-cli openspec add-bazibo-unlock).
  # Signing key + device salt live ONLY in the out-of-band Secret
  # `netnl-bridge` (NETNL_BAZIBO_SIGNING_KEY, NETNL_BAZIBO_DEVICE_SALT).
  # Without NETNL_BAZIBO_EXTRA_ID the feature is dormant: /bazibo/activate
  # answers 503 "off" and Extra purchases are ignored. It is set below (the
  # Extra's numeric id from buymeacoffee.com/<page>/e/<id>):
  #   NETNL_BAZIBO_EXTRA_ID: "<id>"
  # The BMC webhook keeps "support created" ticked (the only event this
  # account offers; Extra purchases routed from it). The Extra is id 603413
  # ("Bazibo full version unlock!", EUR 1), so switching on is:
  #   NETNL_BAZIBO_EXTRA_ID: "603413"
  # Hand issue from a BMC sale mail (works while dormant):
  #   kubectl -n netnl exec deploy/netnl -- netnl-admin bazibo mint --mail <addr> --ref <txn>
  # See docs/how-to/supporter-webhook.md#switching-it-on in internetnl-cli.
  # Startup refuses a signing key that does not match this public key.
  NETNL_BAZIBO_PUBLIC_KEY: "Dpnm6nFTwx1A-kFUf7IMoz4SVUF-O_biI-edjvzpP_4"
  NETNL_BAZIBO_MIN_AMOUNT: "1"
  # ON since 27 Nov 2026 (Mark: "ja, bouw maar"; Bazibo web unlock live in bazibo #125).
  NETNL_BAZIBO_EXTRA_ID: "603413"
  # A plain BMC donation of at least NETNL_BAZIBO_DONATION_MIN (default 1) also
  # mints a Bazibo code (27 Nov 2026: BMC sends this account no webhook for an
  # Extra, only "support created"; Mark: "1 is goed als de flow maar duidelijk
  # is"). The netnl key at NETNL_SUPPORTER_MIN_AMOUNT is unchanged. Off: "0".
  NETNL_BAZIBO_FROM_DONATIONS: "1"
  # netnl-bazibo-watch (bazibo-watch-cronjob.yaml) mails this address once per
  # transaction whose code was not delivered within 15 minutes.
  NETNL_BAZIBO_ALERT_TO: "mark@westerweel.work"

  NETNL_DB: "/data/netnl.sqlite3"
  NETNL_HOST: "0.0.0.0"
  NETNL_PORT: "8000"

  # Limits and retention use the app defaults unless set here (all tunable):
  # NETNL_RATE_LIMIT (10/h), NETNL_MAX_DOMAINS (500), NETNL_MAX_CONCURRENT (2),
  # NETNL_RESULT_RETENTION_DAYS (7), NETNL_AUDIT_RETENTION_DAYS (90),
  # NETNL_RESERVING_GRACE_SECONDS (300). Adjust once beta capacity is known.
