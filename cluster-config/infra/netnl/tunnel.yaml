# Cloudflare Tunnel: publieke merknaam voor de facade —
# https://api.westerweel.work → tunnel `netnl-api` (60c7c8be…) → deze
# cloudflared-pod → Service netnl:8000. Bestaat NAAST de Tailscale
# Funnel (funnel.yaml, netnl.<tailnet>.ts.net); beide wijzen naar
# dezelfde facade.
#
# De tunnel is remotely-managed: de ingress-regels (hostname → service)
# staan bij Cloudflare (Zero Trust → Networks → Tunnels), niet hier.
# Het run-token leeft ALLEEN in het out-of-band Secret `netnl-tunnel`
# (zelfde patroon als netnl-upstream) — nooit in Git. De CNAME
# api.westerweel.work → <tunnel-id>.cfargotunnel.com is proxied (oranje
# wolk): bij een tunnel is dát juist de bedoeling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netnl-tunnel
  labels: { app: netnl, component: tunnel }
spec:
  replicas: 1
  selector:
    matchLabels: { app: netnl, component: tunnel }
  template:
    metadata:
      labels: { app: netnl, component: tunnel }
    spec:
      # DNS-fix (2026-09-05): cloudflared zoekt bij het opstarten de SRV-record
      # _v2-origintunneld._tcp.argotunnel.com op. Faalt die lookup, dan stopt
      # het proces met exit 1 — geen retry. Dat gebeurde ~6x/dag ("server
      # misbehaving" van CoreDNS), en tijdens zo'n herstart geeft Cloudflare
      # HTTP 530 op api.westerweel.work; de dagelijkse meting van
      # internetnl-cli-demo viel er op 2026-09-05 op om.
      #   - ndots 2: die naam heeft 3 punten, dus met de standaard ndots 5 werd
      #     hij eerst tegen alle search-domains geprobeerd (vier zinloze
      #     queries naar CoreDNS vóór de echte). Nu direct absoluut.
      #   - 1.1.1.1 als extra nameserver ACHTER de cluster-resolver: valt in
      #     als CoreDNS SERVFAIL geeft. ClusterFirst blijft staan, want de
      #     tunnel-ingress wijst naar de cluster-Service `netnl` — die moet
      #     door CoreDNS opgelost blijven worden.
      dnsPolicy: ClusterFirst
      dnsConfig:
        nameservers:
          - 1.1.1.1
        options:
          - { name: ndots, value: "2" }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532        # image draait als nonroot
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.2
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: { name: netnl-tunnel, key: TUNNEL_TOKEN }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 15
          resources:
            requests: { cpu: "10m",  memory: "32Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
