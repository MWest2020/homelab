# Cloudflare Tunnel: publieke merknaam voor de facade —
# https://api.westerweel.work → tunnel `netnl-api` (60c7c8be…) → deze
# cloudflared-pod → Service netnl:8000. Bestaat NAAST de Tailscale
# Funnel (funnel.yaml, netnl.<tailnet>.ts.net); beide wijzen naar
# dezelfde facade.
#
# De tunnel is remotely-managed: de ingress-regels (hostname → service)
# staan bij Cloudflare (Zero Trust → Networks → Tunnels), niet hier.
# Het run-token leeft ALLEEN in het out-of-band Secret `netnl-tunnel`
# (zelfde patroon als netnl-upstream) — nooit in Git. De CNAME
# api.westerweel.work → <tunnel-id>.cfargotunnel.com is proxied (oranje
# wolk): bij een tunnel is dát juist de bedoeling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netnl-tunnel
  labels: { app: netnl, component: tunnel }
spec:
  replicas: 1
  selector:
    matchLabels: { app: netnl, component: tunnel }
  template:
    metadata:
      labels: { app: netnl, component: tunnel }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532        # image draait als nonroot
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.2
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: { name: netnl-tunnel, key: TUNNEL_TOKEN }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 15
          resources:
            requests: { cpu: "10m",  memory: "32Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
