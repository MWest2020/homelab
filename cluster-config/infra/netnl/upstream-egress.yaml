# Tailscale-operator EGRESS: maakt de batch-instance op de VPS
# (netnl-instance, tailnet-only op 100.65.70.52:443) bereikbaar voor pods
# in dit cluster — pods zitten zelf niet op de tailnet, de operator zet
# hier een proxy-pod voor in.
#
# LET OP: de operator MUTEERT deze Service naar type ExternalName
# (ts-netnl-upstream-egress-<hash>.tailscale.svc.cluster.local). De
# ArgoCD-Application `netnl` heeft daarom ignoreDifferences op de spec
# van deze Service + RespectIgnoreDifferences (out-of-band gepatcht,
# net als de Application zelf) — anders vechten ArgoCD-selfHeal en de
# operator om de spec.
#
# De facade bereikt dit via de hostnaam `netnl.westerweel.work`: een
# CoreDNS-rewrite (kube-system/coredns) wijst die naam in-cluster naar
# deze Service. De echte hostnaam is vereist: de nginx op de instance
# doet strikte SNI en serveert het Let's Encrypt-certificaat voor
# precies die naam. (Publiek wijst netnl.westerweel.work naar het
# publieke VPS-IP, waar 443 geblokkeerd is; alleen dit tailnet-pad
# komt binnen.)
apiVersion: v1
kind: Service
metadata:
  name: netnl-upstream-egress
  annotations:
    tailscale.com/tailnet-ip: "100.65.70.52"
spec:
  ports:
    - name: https
      port: 443
      protocol: TCP
